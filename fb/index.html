  <style>
    :root{
      --wine:#6E2B3A;--wine-deep:#4A1D28;--ink:#37211D;--rose:#845149;--blush:#B1948B;
      --cream:#F7EFE6;--gold:#F2C46D;--gold-light:#F8DC9E;--gold-deep:#E6AE52;
      --serif:Georgia,"Times New Roman",serif;
      --sans:"Avenir Next",Avenir,Montserrat,"Gill Sans","Trebuchet MS",sans-serif;
      --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;
      --r-sm:10px;--r-md:18px;--r-xl:28px;
      --ease:cubic-bezier(.2,.8,.2,1);
      --shade:color-mix(in srgb,var(--ink) 30%,transparent);
      --shade-soft:color-mix(in srgb,var(--ink) 16%,transparent);
      --glow:color-mix(in srgb,var(--gold) 75%,transparent);
      --shine:color-mix(in srgb,var(--cream) 70%,transparent);
      --edge:inset 0 0 0 1.5px var(--wine-deep);
      --lift:0 12px 28px var(--shade)
    }
    *{box-sizing:border-box}
    html{background:var(--cream);-webkit-text-size-adjust:100%}
    body{
      margin:0;color:var(--ink);font:400 17px/1.5 var(--sans);-webkit-font-smoothing:antialiased;
      background:
        radial-gradient(90% 55% at 12% 0%,color-mix(in srgb,var(--gold) 22%,transparent),transparent 70%),
        var(--cream)
    }
    img{display:block}
    .page{display:flex;flex-direction:column;width:100%;max-width:480px;min-height:100vh;min-height:100svh;margin:0 auto}
    main{flex:1}

    /* Brand row */
    .brand{display:flex;align-items:center;gap:var(--s3);padding:14px var(--s4) 0}
    .avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px var(--gold),0 6px 16px var(--shade-soft)}
    .name{margin:0;font:700 1.15rem/1.15 var(--serif);color:var(--ink)}
    .tag{display:inline-block;margin-top:5px;padding:3px 10px;border:1px solid var(--blush);border-radius:999px;color:var(--rose);font:600 .72rem/1.4 var(--sans);letter-spacing:.16em;text-transform:uppercase}

    /* Hero card: photo, headline, one CTA */
    .hero{margin:14px var(--s4) 0}
    .photo{position:relative;height:clamp(300px,calc(100vh - 258px),540px);height:clamp(300px,calc(100svh - 258px),540px);overflow:hidden;border-radius:var(--r-xl);box-shadow:0 18px 40px var(--shade-soft);background:var(--cream)}
    .photo img{width:100%;height:100%;object-fit:cover;object-position:50% 72%}
    .hero-copy{position:absolute;inset:0 0 auto;z-index:1;padding:22px 22px 64px;
      background:linear-gradient(180deg,color-mix(in srgb,var(--cream) 92%,transparent) 0%,color-mix(in srgb,var(--cream) 85%,transparent) 60%,color-mix(in srgb,var(--cream) 60%,transparent) 78%,transparent 100%)}
    h1{margin:0;max-width:13ch;color:var(--wine);font:italic 700 clamp(31px,8.4vw,44px)/1.04 var(--serif);letter-spacing:-.02em;text-wrap:balance}
    h1 em{font-style:inherit;text-decoration:underline;text-decoration-color:var(--gold);text-decoration-thickness:.09em;text-underline-offset:.12em}
    .kicker{margin:var(--s3) 0 0;color:var(--ink);font:italic 400 1.2rem/1.3 var(--serif)}

    /* The CTA: gold gradient, wine label, arrow chip. Attention loop every 2.5 s for everyone:
       glow ring, shimmer sweep, arrow nudge and a 1 to 1.03 breath, all transform/opacity only */
    .cta{position:relative;isolation:isolate;display:flex;align-items:center;justify-content:center;gap:14px;
      width:100%;min-height:64px;margin-top:14px;padding:var(--s3) var(--s5);border-radius:var(--r-md);
      background:linear-gradient(135deg,var(--gold-light) 0%,var(--gold) 45%,var(--gold-deep) 100%);
      color:var(--wine-deep);font:800 1.2rem/1.2 var(--sans);letter-spacing:.01em;text-decoration:none;
      box-shadow:var(--edge),var(--lift);transition:transform .18s var(--ease);
      animation:breath 2.5s ease-in-out infinite;will-change:transform;-webkit-tap-highlight-color:transparent}
    .cta:before{content:"";position:absolute;inset:0;z-index:-2;border-radius:inherit;pointer-events:none;
      box-shadow:0 0 0 3px var(--glow),0 0 18px 4px var(--glow);opacity:0;
      animation:pulse 2.5s var(--ease) infinite}
    .shine{position:absolute;inset:0;z-index:-1;overflow:hidden;border-radius:inherit;pointer-events:none}
    .shine:after{content:"";position:absolute;inset:0;
      background:linear-gradient(105deg,transparent 30%,var(--shine) 50%,transparent 70%);
      transform:translateX(-130%);animation:shimmer 2.5s ease-in-out infinite}
    .chip{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--wine-deep);color:var(--gold);font-size:1.1rem;animation:nudge 2.5s ease-in-out infinite}
    .cta:hover{filter:brightness(1.04)}
    .cta:active{animation:none;transform:translateY(1px) scale(.97);filter:brightness(.94);
      box-shadow:var(--edge),inset 0 3px 8px var(--shade),0 4px 10px var(--shade)}
    .cta:active:before{animation:none;opacity:0}
    .cta:focus-visible{outline:3px solid var(--wine);outline-offset:3px}
    @keyframes breath{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
    @keyframes pulse{0%{opacity:.9;transform:scale(1)}70%,100%{opacity:0;transform:scale(1.06,1.32)}}
    @keyframes shimmer{0%{transform:translateX(-130%)}55%,100%{transform:translateX(130%)}}
    @keyframes nudge{0%,55%,100%{transform:translateX(0)}65%{transform:translateX(5px)}75%{transform:translateX(0)}85%{transform:translateX(3px)}}
    /* Reduced motion: no breath, no shimmer; a smaller glow pulse and a 3 px arrow nudge stay */
    @keyframes pulse-soft{0%{opacity:.75;transform:scale(1)}70%,100%{opacity:0;transform:scale(1.02,1.12)}}
    @keyframes nudge-soft{0%,60%,100%{transform:translateX(0)}75%{transform:translateX(3px)}}

    .foot{margin-top:20px;padding:var(--s4) 20px max(var(--s4),env(safe-area-inset-bottom));background:var(--ink);color:var(--blush);font:600 .72rem/1.4 var(--sans);letter-spacing:.16em;text-transform:uppercase;text-align:center}
    .foot p{margin:0}

    /* Load: staggered rise of the copy; the hero photo never animates (it is the LCP) */
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .brand,.hero-copy h1,.kicker{animation:rise .42s var(--ease) both}
    .hero-copy h1{animation-delay:90ms}.kicker{animation-delay:160ms}

    @media (min-width:520px){
      .brand{padding-top:var(--s6)}
      .foot{border-radius:var(--r-xl) var(--r-xl) 0 0}
    }
    @media (max-height:600px){h1{font-size:clamp(28px,7.6vw,38px)}}
    @media (prefers-reduced-motion:reduce){
      .brand,.hero-copy h1,.kicker,.cta{animation:none}
      .shine{display:none}
      .cta{transition:none}
      .cta:before{animation-name:pulse-soft}
      .chip{animation-name:nudge-soft}
    }
  </style>
</head>

            <p class="kicker">Your past, your now and what may be coming next.</p>
          </div>
        </div>
        <a class="cta" href="https://app.auralyapp.com/6adfc3acc2a6e93c4de61d6d?rt_ad=delia&amp;utm_source=facebook&amp;utm_term=bio&amp;aff=b0wnkasb"><span class="shine" aria-hidden="true"></span>Pick my 3 cards <span class="chip" aria-hidden="true">→</span></a>
      </section>
    </main>

    <footer class="foot">
      <p>Delia Hart · Venus &amp; Love Readings</p>
    </footer>
  </div>
</body>
